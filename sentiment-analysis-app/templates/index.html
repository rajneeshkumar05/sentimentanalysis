<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment AI - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xl w-full">
        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-indigo-100/50 p-10 border border-slate-100">
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-3xl rotate-12 mb-6 shadow-xl shadow-indigo-200">
                    <span class="text-3xl rotate-[-12deg]">🧠</span>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Sentiment Analysis</h1>
                <p class="text-slate-500 mt-2 font-medium">Identify emotions in your text instantly</p>
            </div>

            <form action="/predict" method="post" class="space-y-6">
                <div class="relative group">
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Your Message</label>
                    <textarea 
                        name="text" 
                        required
                        placeholder="How are you feeling today?"
                        class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all duration-300 min-h-[150px] text-slate-700 leading-relaxed"
                    ></textarea>
                </div>

                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg shadow-indigo-200 transition-all duration-300 transform hover:-translate-y-1 active:scale-[0.98] flex items-center justify-center gap-2">
                    Analyze Sentiment
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
